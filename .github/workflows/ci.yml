name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 722769295788.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    name: Lint & Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, notification-service, frontend, nginx]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Debug OIDC Claims
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          JWT=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r)

          echo "sub=$(echo "$PAYLOAD" | jq -r '.sub')"
          echo "aud=$(echo "$PAYLOAD" | jq -r '.aud')"
          echo "repository=$(echo "$PAYLOAD" | jq -r '.repository')"
          echo "ref=$(echo "$PAYLOAD" | jq -r '.ref')"

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::722769295788:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR repository
        id: ecr
        shell: bash
        run: |
          case "${{ matrix.service }}" in
            auth-service)
              echo "repository=devops-auth" >> "$GITHUB_OUTPUT"
              ;;
            product-service)
              echo "repository=devops-catalog" >> "$GITHUB_OUTPUT"
              ;;
            order-service)
              echo "repository=devops-orders" >> "$GITHUB_OUTPUT"
              ;;
            notification-service)
              echo "repository=devops-notification" >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              echo "repository=devops-frontend" >> "$GITHUB_OUTPUT"
              ;;
            nginx)
              echo "repository=devops-nginx" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ (matrix.service == 'frontend' || matrix.service == 'nginx') && format('./{0}', matrix.service) || format('./services/{0}', matrix.service) }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ steps.ecr.outputs.repository }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ steps.ecr.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          